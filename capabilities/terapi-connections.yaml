naftiko: 1.0.0-alpha2
info:
  label: Terapi API — Connections
  description: 'Terapi API — Connections. 4 operations. Lead operation: List Connections. Self-contained Naftiko capability
    covering one Terapi business surface.'
  tags:
  - Terapi
  - Connections
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TERAPI_API_KEY: TERAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: terapi-connections
    baseUri: https://api.terapi.dev
    description: Terapi API — Connections business capability. Self-contained, no shared references.
    resources:
    - name: connection
      path: /connection
      operations:
      - name: listconnections
        method: GET
        description: List Connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: provider_config_key
          in: query
          type: string
          description: Filter connections by integration provider config key
        - name: connection_id
          in: query
          type: string
          description: Filter by a specific connection ID
      - name: createconnection
        method: POST
        description: Create Connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: connection-connection_id
      path: /connection/{connection_id}
      operations:
      - name: getconnection
        method: GET
        description: Get Connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: connection_id
          in: path
          type: string
          description: The unique identifier of the connection
          required: true
        - name: provider_config_key
          in: query
          type: string
          description: The provider config key for this connection
          required: true
      - name: deleteconnection
        method: DELETE
        description: Delete Connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: connection_id
          in: path
          type: string
          description: The unique identifier of the connection
          required: true
        - name: provider_config_key
          in: query
          type: string
          description: The provider config key for this connection
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.TERAPI_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: terapi-connections-rest
    port: 8080
    description: REST adapter for Terapi API — Connections. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/connection
      name: connection
      description: REST surface for connection.
      operations:
      - method: GET
        name: listconnections
        description: List Connections
        call: terapi-connections.listconnections
        with:
          provider_config_key: rest.provider_config_key
          connection_id: rest.connection_id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createconnection
        description: Create Connection
        call: terapi-connections.createconnection
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/connection/{connection-id}
      name: connection-connection-id
      description: REST surface for connection-connection_id.
      operations:
      - method: GET
        name: getconnection
        description: Get Connection
        call: terapi-connections.getconnection
        with:
          connection_id: rest.connection_id
          provider_config_key: rest.provider_config_key
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteconnection
        description: Delete Connection
        call: terapi-connections.deleteconnection
        with:
          connection_id: rest.connection_id
          provider_config_key: rest.provider_config_key
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: terapi-connections-mcp
    port: 9090
    transport: http
    description: MCP adapter for Terapi API — Connections. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-connections
      description: List Connections
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: terapi-connections.listconnections
      with:
        provider_config_key: tools.provider_config_key
        connection_id: tools.connection_id
      outputParameters:
      - type: object
        mapping: $.
    - name: create-connection
      description: Create Connection
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: terapi-connections.createconnection
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-connection
      description: Get Connection
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: terapi-connections.getconnection
      with:
        connection_id: tools.connection_id
        provider_config_key: tools.provider_config_key
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-connection
      description: Delete Connection
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: terapi-connections.deleteconnection
      with:
        connection_id: tools.connection_id
        provider_config_key: tools.provider_config_key
      outputParameters:
      - type: object
        mapping: $.
