naftiko: 1.0.0-alpha2
info:
  label: Terapi API — Actions
  description: 'Terapi API — Actions. 1 operations. Lead operation: Trigger Action. Self-contained Naftiko capability covering
    one Terapi business surface.'
  tags:
  - Terapi
  - Actions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TERAPI_API_KEY: TERAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: terapi-actions
    baseUri: https://api.terapi.dev
    description: Terapi API — Actions business capability. Self-contained, no shared references.
    resources:
    - name: action-trigger
      path: /action/trigger
      operations:
      - name: triggeraction
        method: POST
        description: Trigger Action
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.TERAPI_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: terapi-actions-rest
    port: 8080
    description: REST adapter for Terapi API — Actions. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/action/trigger
      name: action-trigger
      description: REST surface for action-trigger.
      operations:
      - method: POST
        name: triggeraction
        description: Trigger Action
        call: terapi-actions.triggeraction
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: terapi-actions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Terapi API — Actions. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: trigger-action
      description: Trigger Action
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: terapi-actions.triggeraction
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
