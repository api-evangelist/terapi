aid: terapi
name: Terapi
description: >-
  Terapi is an open-source embedded integration platform for building native product integrations. It provides a
  self-hosted iPaaS with pre-built connectors, authentication management, unified APIs, and workflow automation for SaaS
  products needing to offer native third-party integrations to their customers.
